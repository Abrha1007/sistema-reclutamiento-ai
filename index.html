<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chat de ayuda</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --color-primario: #f43f5e;
      --bg: #0f172a;
      --panel: #1f2937;
      --texto: #e2e8f0;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: system-ui;
      color: white;
    }

    #chatbot-toggle {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 56px; height: 56px;
      border-radius: 9999px;
      background: var(--color-primario);
      display: grid; place-items: center;
      cursor: pointer;
      font-size: 26px;
    }

    #chatbot-box {
      position: fixed;
      bottom: 90px; right: 20px;
      width: 320px; height: 420px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
    }

    #chatbot-box.hidden { display: none; }

    #chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg {
      max-width: 90%;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
    }

    .user { background: #22d3ee; color: black; align-self: flex-end; }
    .assistant { background: #1f2937; }

    #chatbot-form {
      display: flex;
    }

    #chatbot-input {
      flex: 1;
      background: transparent;
      border: 0;
      color: white;
      padding: 8px;
    }

    #chatbot-send {
      background: none;
      border: 0;
      color: white;
      cursor: pointer;
    }

    /* 🔥 NUEVA SECCIÓN CV */
    #cv-panel {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 350px;
      background: var(--panel);
      padding: 15px;
      border-radius: 15px;
    }

    button {
      background: var(--color-primario);
      border: none;
      padding: 8px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
      width: 100%;
    }

    #resultadoCV, #listaCandidatos {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }

    .card {
      border: 1px solid #444;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
    }

  </style>
</head>

<body>

<!-- BOTÓN CHAT -->
<div id="chatbot-toggle">💬</div>

<!-- CHAT -->
<div id="chatbot-box" class="hidden">
  <div id="chatbot-messages"></div>
  <form id="chatbot-form">
    <input id="chatbot-input" placeholder="Escribe tu duda..." />
    <button id="chatbot-send">➤</button>
  </form>
</div>

<!-- 🔥 PANEL CV -->
<div id="cv-panel">
  <h3>📄 Analizar CV</h3>
  <input type="file" id="cvFile" accept="application/pdf" />
  <button onclick="subirCV()">Analizar CV</button>

  <div id="resultadoCV"></div>

  <hr>

  <button onclick="verCandidatos()">📊 Ver candidatos</button>
  <div id="listaCandidatos"></div>
</div>

<script>
const API_CHAT = "/chat";
const API_CV = "/analizar-cv";
const API_LIST = "/candidatos";


const toggle = document.getElementById("chatbot-toggle");
const box = document.getElementById("chatbot-box");
const messagesDiv = document.getElementById("chatbot-messages");
const form = document.getElementById("chatbot-form");
const input = document.getElementById("chatbot-input");

const chatHistory = [
  { role: "assistant", content: "Hola 👋 soy tu bot de ayuda." }
];

render();

toggle.onclick = () => {
  box.classList.toggle("hidden");
};

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  chatHistory.push({ role: "user", content: text });
  render();
  input.value = "";

  const res = await fetch(API_CHAT, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ messages: chatHistory })
  });

 const data = await res.json();

if (data.reply && data.reply.content) {
  chatHistory.push(data.reply);
} else {
  chatHistory.push({
    role: "assistant",
    content: "Error del servidor 😢"
  });
}

render();

});

function render() {
  messagesDiv.innerHTML = "";
  chatHistory.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.textContent = m.content;
    messagesDiv.appendChild(div);
  });
}

//subir CV 
async function subirCV() {
  const file = document.getElementById("cvFile").files[0];
  if (!file) return alert("Selecciona un PDF");

  const formData = new FormData();
  formData.append("cv", file);

  document.getElementById("resultadoCV").innerText = "Analizando...";

  try {
    const res = await fetch(API_CV, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.analisis) {
      document.getElementById("resultadoCV").innerText = data.analisis;
    } else {
      document.getElementById("resultadoCV").innerText = "Error al analizar CV 😢";
    }

  } catch (err) {
    document.getElementById("resultadoCV").innerText = "Error de conexión 😢";
  }
}



// 🔥 VER CANDIDATOS
async function verCandidatos() {
  const res = await fetch(API_LIST);
  const data = await res.json();

  const cont = document.getElementById("listaCandidatos");
  cont.innerHTML = "";

  data.forEach(c => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerText = c.analisis || "Sin datos";
  cont.appendChild(div);
});

}

</script>

</body>
</html>
